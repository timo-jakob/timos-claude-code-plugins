<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts for the SVG diagrams in manual.pdf and the workflows booklet.

  pandoc/extra registers no system fonts (fc-list is empty), so rsvg-convert —
  which pandoc's xelatex path uses to turn an SVG into a PDF figure — draws every
  diagram label as a missing-glyph box. TeX Live ships Source Sans Pro as
  OpenType; this config hands that directory to fontconfig. Both docs workflows
  and scripts/build-workflows-booklet.zsh pass it as FONTCONFIG_FILE, and
  scripts/mermaid/config.json names Source Sans Pro first so the label text
  resolves to it.
-->
<fontconfig>
  <dir>/opt/texlive/texdir/texmf-dist/fonts/opentype/adobe/sourcesanspro</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Source Sans Pro</family></prefer>
  </alias>
</fontconfig>
