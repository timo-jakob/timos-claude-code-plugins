# A copy of the clean variant's chart deployment (../../../../../kubernetes-repo/
# charts/app/templates/deployment.yaml), kept clean to the same standard so the
# only thing this fixture exercises is INFLATION: whether the overlay's
# `helmCharts:` entry renders at all. Nothing here is deliberately broken.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: app
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: registry.example.com/app:1.0.0
          ports:
            # declared so the default readiness-port check is satisfied: it
            # fires when a probe targets a port the container does not expose
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
