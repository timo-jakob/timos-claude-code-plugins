# Derived mechanically from the clean variant's charts/app/templates/deployment.yaml
# with exactly ONE guarantee removed: the allowed registry.
#
# The image is PINNED (1.27.0, not latest), so `latest-tag` does NOT also fire
# and the only finding is the Kyverno policy one — which is what makes this the
# expected-FAIL resource of this variant's kyverno-test.yaml.
#
# The off-registry host is an example.com placeholder rather than a real
# registry: the fixture's self-containedness rule admits no hostname outside
# example.com and kubernetes.default.svc, and `other-registry.example.com` is
# just as far outside the policy's `registry.example.com/*` as a real one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bad-registry
  template:
    metadata:
      labels:
        app: bad-registry
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: bad-registry
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: other-registry.example.com/nginx:1.27.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
