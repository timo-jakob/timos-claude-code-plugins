# Org API styleguide — Spectral ruleset (issues #689, #944).
#
# This file is a PUBLISHED ARTIFACT, not a bootstrap template. It is served over
# jsDelivr from an immutable git tag (styleguide-vX.Y.Z) and every bootstrapped
# repo's .spectral.yaml `extends` it at an EXACT pinned version:
#
#   https://cdn.jsdelivr.net/gh/timo-jakob/timos-claude-code-plugins@styleguide-v2.0.0/styleguide/spectral/ruleset.yaml
#
# That is why it lives at the repo root rather than under
# development/skills/bootstrap/templates/ — a template is rendered INTO a repo,
# this is fetched BY one at lint time.
#
# TAGS ARE IMMUTABLE. A styleguide-v* tag, once cut, is never moved or deleted;
# a mistake is superseded by the next version. jsDelivr caches by tag, so
# re-pointing one would hand different repos different rules under the same
# version string, with no PR anywhere to notice it.
#
# Versioning policy:
#   MAJOR — a new or stricter error-severity rule, or a rule-id rename: anything
#           that can redden a downstream repo that was green on the previous pin.
#   MINOR — a new rule shipped at warn, or additive message/documentationUrl
#           coverage that cannot fail a previously-passing spec.
#   PATCH — fix-hint wording, doc-URL and typo fixes, with no change to severity
#           or to what a rule matches.
#
# The prose styleguide these rules link to is the authoritative convention text:
# https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/
extends: ["spectral:oas"]
rules:
  # --- Codified from the #692 starter -------------------------------------
  # Already conventions; severity promoted where noted. These are spectral:oas
  # rules referenced by id, so they carry their own messages.

  # A stable operationId is what the consumer's client generator and the
  # deprecation -> @deprecated mapping (#707) key off.
  operation-operationId: error
  operation-operationId-unique: error
  # Descriptions ARE the governance-portal docs (the APIM channel, #706), so a
  # missing one is a hard failure in the org ruleset (starter: warn).
  info-description: error
  operation-description: error
  # Tags give the portal and the generated client a stable grouping.
  operation-tags: error

  # --- Re-scoped from the starter -----------------------------------------

  # The starter's `deprecation-has-sunset`, scoped to OPERATIONS only and raised
  # warn -> error. The starter's given (`$..[?(@ && @.deprecated === true)]`)
  # also matched deprecated parameters, schema properties and any `deprecated:
  # true` inside example data, which is why it could only ever be a warning.
  # Anchoring at `$.paths[*]` and filtering its direct children selects exactly
  # the operation objects: a deprecated schema property lives under
  # `components`, so it is out of reach by construction.
  org-deprecated-operation-has-sunset:
    description: A deprecated operation must declare an x-sunset date (RFC 8594).
    message: >-
      deprecated operation declares no x-sunset: add `x-sunset: <YYYY-MM-DD>`
      (RFC 8594) so clients know when it dies
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#deprecation
    severity: error
    given: "$.paths[*][?(@.deprecated === true)]"
    then:
      field: x-sunset
      function: truthy

  # --- Newly minted --------------------------------------------------------

  # Path segments are lowercase kebab-case nouns, and never verbs — the HTTP
  # method is the verb. Path parameters (`{userId}`) are exempt.
  #
  # DELIBERATE LIMIT: plurality is a CONVENTION this rule does not mechanically
  # enforce. English pluralization cannot be checked by regex without flagging
  # legitimate singulars (/status, /health, /inventory), so the linter enforces
  # the half it can prove and the styleguide states the other half out loud. The
  # message still asks for the full convention, because a fix hint should
  # describe the target, not the subset the checker can see.
  org-resource-naming:
    description: Path segments are plural kebab-case nouns, never verbs.
    message: >-
      {{property}} is not a plural kebab-case noun path: use lowercase plural
      kebab-case segments and put the verb in the HTTP method
      (POST /getUser -> POST /users)
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#resource-naming
    severity: error
    given: "$.paths"
    then:
      - field: "@key"
        function: pattern
        functionOptions:
          # Each segment is either a lowercase kebab-case literal or a {param}.
          match: "^/$|^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[A-Za-z0-9_]+\\}))+$"
      - field: "@key"
        function: pattern
        functionOptions:
          # A segment that STARTS with a verb and then ends, hyphenates or
          # camel-cases is a verb-in-path. The trailing-context guard is what
          # keeps nouns that merely begin with those letters clean:
          # /addresses, /searches and /deleted-items all pass, and each is a
          # case in the conforming fixture.
          notMatch: "(^|/)(get|create|update|delete|remove|list|fetch|retrieve|add|search|\
            find|submit|execute|do|make)([A-Z_-]|$|/)"

  # Error responses carry RFC 9457 problem details, bare — a 4xx/5xx must offer
  # application/problem+json and must NOT also offer application/json, so a
  # client never has to negotiate between two error shapes.
  org-problem-json-errors:
    description: 4xx/5xx responses return RFC 9457 application/problem+json.
    message: "4xx/5xx must return bare application/problem+json (RFC 9457) with type, title, status and detail required"
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#error-bodies
    severity: error
    # Numeric status keys AND the OpenAPI range keys. `@property >= 400` alone
    # never matches "4XX"/"5XX" — they coerce to NaN — so a spec that declares
    # its errors only as ranges would sail through untouched. `default` is
    # deliberately NOT matched: it is the catch-all, not necessarily an error,
    # and the styleguide says so out loud rather than over-firing.
    given: "$.paths[*][*].responses[?(@property >= 400 && @property < 600 ||
      @property === '4XX' || @property === '5XX')]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["content"]
          properties:
            content:
              type: object
              required: ["application/problem+json"]
              # BARE means bare — problem+json and nothing else. `not: required:
              # [application/json]` would have forbidden only the one alternative
              # anyone actually writes, leaving text/plain and application/xml to
              # reintroduce the second error shape this rule exists to prevent.
              maxProperties: 1
              properties:
                application/problem+json:
                  type: object
                  required: ["schema"]
                  properties:
                    schema:
                      type: object
                      required: ["required"]
                      properties:
                        required:
                          type: array
                          allOf:
                            - contains: {const: "type"}
                            - contains: {const: "title"}
                            - contains: {const: "status"}
                            - contains: {const: "detail"}

  # --- Pagination (#944) ---------------------------------------------------
  #
  # Cursor pagination only. Offset-style pagination double-counts and skips rows
  # under concurrent writes, and its cost grows with the page number.
  #
  # WHAT COUNTS AS A COLLECTION, mechanically: a GET whose 200
  # `application/json` schema is either
  #   (a) a top-level `type: array`, or
  #   (b) an object with a REQUIRED property named `items` of `type: array`.
  #
  # That definition is inlined as the `if` of ONE rule below —
  # `org-pagination-cursor-params`. The other two are NOT gated by it:
  #
  #   `org-pagination-envelope` is deliberately BROADER. Clause (a) rejects any
  #   bare-array 200; clause (b) fires on any body whose `required` contains
  #   `items` — whatever that member turns out to be — and demands `next_cursor`
  #   beside it. Opting into the envelope's NAME is what triggers it, which is
  #   not the same test as detection shape (b).
  #
  #   `org-pagination-no-offset-params` is not gated at all: the banned names are
  #   rejected on every parameter in the document, collection or not, in any
  #   `in:` location.
  #
  # Between them, an object carrying its array under any other name is invisible
  # to the first two, which is how the shared ops fragment (`/info` returns
  # `required: [build, api]`, its array named `api`) stays clean with NO
  # `overrides:` block anywhere in this file. Scoping is fixed by being correct,
  # never by silencing.
  #
  # `org-pagination-cursor-params` and `org-pagination-envelope` both key on the
  # LITERAL `200` response key, so a collection GET that declares its success
  # response only as the range key `2XX` is invisible to those TWO (the offset
  # ban never inspects responses and is unaffected). Unlike
  # `org-deprecation-sunset-headers`, which matches `2XX`, that is an accepted
  # gap rather than a design: the styleguide page states it.
  #
  # DELIBERATE LIMIT: a genuinely growing collection can evade detection by
  # naming its array `results`. The normative rule is "every collection
  # paginates"; Spectral enforces the detectable subset and review covers the
  # rest. The styleguide page says so out loud.

  # Anchored at the OPERATION, because `parameters` is a sibling of `responses`.
  # A path-item-level declaration is therefore not seen — and since the `then`
  # also requires the operation to HAVE a `parameters` list, hoisting
  # `cursor`/`limit` into the path item does not merely lose the check, it
  # FLAGS the operation. An over-fire, stated on the styleguide page rather
  # than papered over.
  org-pagination-cursor-params:
    description: A collection GET declares cursor and limit query parameters.
    message: >-
      collection GET declares no cursor pagination parameters: add `cursor`
      (in: query, string) and `limit` (default 50, max 200)
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#pagination
    severity: error
    given: "$.paths[*].get"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          # The collection-detection shape, inlined: an `if` that is false
          # leaves the whole rule vacuous, which is what keeps every
          # non-collection GET (and the ops fragment) untouched.
          if:
            type: object
            required: ["responses"]
            properties:
              responses:
                type: object
                required: ["200"]
                properties:
                  "200":
                    type: object
                    required: ["content"]
                    properties:
                      content:
                        type: object
                        required: ["application/json"]
                        properties:
                          application/json:
                            type: object
                            required: ["schema"]
                            properties:
                              schema:
                                anyOf:
                                  # (a) bare array
                                  - type: object
                                    required: ["type"]
                                    properties:
                                      type: {const: "array"}
                                  # (b) object with a required `items` array
                                  - type: object
                                    required: ["required", "properties"]
                                    properties:
                                      required:
                                        type: array
                                        contains: {const: "items"}
                                      properties:
                                        type: object
                                        required: ["items"]
                                        properties:
                                          items:
                                            type: object
                                            required: ["type"]
                                            properties:
                                              type: {const: "array"}
          then:
            type: object
            required: ["parameters"]
            properties:
              parameters:
                type: array
                allOf:
                  - contains:
                      type: object
                      required: ["name", "in"]
                      properties:
                        name: {const: "cursor"}
                        in: {const: "query"}
                  - contains:
                      type: object
                      required: ["name", "in"]
                      properties:
                        name: {const: "limit"}
                        in: {const: "query"}

  # Banned ANYWHERE in a spec and in ANY `in:` location — a `page` header is the
  # same defect wearing a different hat, so the rule never filters on `in`.
  org-pagination-no-offset-params:
    description: Offset-style pagination parameter names are banned.
    message: >-
      `{{value}}` is offset-style pagination, which double-counts and skips rows
      under concurrent writes: use cursor pagination (`cursor` + `limit`)
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#pagination
    severity: error
    given:
      - "$.paths[*].parameters[*]"
      - "$.paths[*][*].parameters[*]"
      - "$.components.parameters[*]"
    then:
      field: name
      function: pattern
      functionOptions:
        notMatch: "^(offset|page|page_size|per_page|skip|start|start_index)$"

  # Applies to EVERY GET's 200 body, not only to detected collections: shape (a)
  # is itself the violation, so a detection gate here would make the rule
  # unable to see the thing it exists to reject.
  org-pagination-envelope:
    description: A collection GET returns an items/next_cursor envelope, never a bare array.
    message: >-
      collection response is not the org envelope: return an object requiring
      `items` (the array) and `next_cursor` (null on the last page), never a
      bare array
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#pagination
    severity: error
    given: "$.paths[*].get.responses['200'].content['application/json'].schema"
    then:
      function: schema
      functionOptions:
        schema:
          allOf:
            # (a) a bare array is never acceptable.
            - not:
                type: object
                required: ["type"]
                properties:
                  type: {const: "array"}
            # (b) once a body opts into the envelope name, it owes the cursor.
            - if:
                type: object
                required: ["required"]
                properties:
                  required:
                    type: array
                    contains: {const: "items"}
              then:
                type: object
                required: ["required"]
                properties:
                  required:
                    type: array
                    contains: {const: "next_cursor"}

  # --- Header conventions (#944) -------------------------------------------

  # POST and PATCH only. PUT and DELETE are idempotent by method, so demanding a
  # key from them would be noise — the rule id names both covered methods so it
  # can never be misread as POST-only.
  org-idempotency-key-on-post-patch:
    description: POST and PATCH declare a required Idempotency-Key header parameter.
    message: >-
      write operation declares no Idempotency-Key: add it as an `in: header`
      parameter with `required: true` (a UUIDv4 is the recommended value)
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#idempotency-key
    severity: error
    given:
      - "$.paths[*].post"
      - "$.paths[*].patch"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["parameters"]
          properties:
            parameters:
              type: array
              contains:
                type: object
                required: ["name", "in", "required"]
                properties:
                  name: {const: "Idempotency-Key"}
                  in: {const: "header"}
                  required: {const: true}

  # Anchored at the OPERATION rather than at the response, because the 503 half
  # needs the operation's `tags` to see the ops exemption.
  #
  # A 429 always owes Retry-After. A 503 owes it too — EXCEPT on an operation
  # tagged `ops`: a probe's 503 addresses an orchestrator ("shed my traffic"),
  # not a client that should come back at a stated time. `tags: ["ops"]` is an
  # intrinsic property of every operation in the shared fragment, not a
  # path-based silencer. The `ops` tag is RESERVED for that fragment; a business
  # operation tagging itself `ops` is a styleguide violation.
  org-retry-after-on-throttled:
    description: A 429 — and a non-ops 503 — declares a Retry-After response header.
    message: >-
      throttled or unavailable response declares no Retry-After: add it as a
      response header with `type: integer` (delta-seconds)
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#retry-after
    severity: error
    given: "$.paths[*][?(@.responses)]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          allOf:
            - if:
                type: object
                required: ["responses"]
                properties:
                  responses:
                    type: object
                    required: ["429"]
              then:
                type: object
                properties:
                  responses:
                    type: object
                    properties:
                      "429":
                        type: object
                        required: ["headers"]
                        properties:
                          headers:
                            type: object
                            required: ["Retry-After"]
                            properties:
                              Retry-After:
                                type: object
                                required: ["schema"]
                                properties:
                                  schema:
                                    type: object
                                    required: ["type"]
                                    properties:
                                      type: {const: "integer"}
            - if:
                allOf:
                  - type: object
                    required: ["responses"]
                    properties:
                      responses:
                        type: object
                        required: ["503"]
                  - not:
                      type: object
                      required: ["tags"]
                      properties:
                        tags:
                          type: array
                          contains: {const: "ops"}
              then:
                type: object
                properties:
                  responses:
                    type: object
                    properties:
                      "503":
                        type: object
                        required: ["headers"]
                        properties:
                          headers:
                            type: object
                            required: ["Retry-After"]
                            properties:
                              Retry-After:
                                type: object
                                required: ["schema"]
                                properties:
                                  schema:
                                    type: object
                                    required: ["type"]
                                    properties:
                                      type: {const: "integer"}

  # The RUNTIME half of org-deprecated-operation-has-sunset: `x-sunset` tells a
  # reader of the spec when the operation dies, these headers tell a running
  # client on every response.
  #
  # Anchored at `$.paths[*]` operation objects only — the same anchor, for the
  # same reason. A document-wide `$..` given also matches a deprecated schema
  # property and a deprecated parameter, which is what forced the #692 starter
  # down to a warning.
  org-deprecation-sunset-headers:
    description: A deprecated operation returns Deprecation and Sunset headers on every 2xx.
    message: >-
      deprecated operation declares no sunset headers: add `Deprecation`
      (RFC 9745) and `Sunset` (RFC 8594) response headers to every 2xx response
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#sunset-headers
    severity: error
    given: "$.paths[*][?(@.deprecated === true)]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["responses"]
          properties:
            responses:
              type: object
              # Numeric 2xx keys AND the OpenAPI `2XX` range key.
              patternProperties:
                "^2([0-9]{2}|XX)$":
                  type: object
                  required: ["headers"]
                  properties:
                    headers:
                      type: object
                      required: ["Deprecation", "Sunset"]

  # Correlation rides W3C `traceparent`, propagated by the OTel SDK per the ops
  # surface (#688); `traceparent` and `tracestate` are explicitly allowed.
  #
  # TWO `then` clauses over one given list, because the banned name lives in a
  # different place in each shape: `name` on a parameter object, and the KEY on
  # a response-headers map. `field: name` does not resolve on a headers map and
  # is skipped there; `field: "@key"` iterates the target object's keys, which
  # are the header names on a map and the harmless `name`/`in`/`schema` member
  # names on a parameter object. Keeping the pattern ANCHORED (`^…$`) is what
  # makes that second case safe.
  # The pattern is a `/…/i` literal, not a bare string: header names are
  # case-insensitive on the wire, so `X-REQUEST-ID` must be caught as surely as
  # `X-Request-Id`. Spectral parses the delimited form and honours the flag.
  org-no-bespoke-correlation-headers:
    description: Bespoke correlation headers are banned; correlation rides W3C traceparent.
    message: >-
      bespoke correlation header: drop it and use W3C `traceparent`
      (and `tracestate`), which the OTel SDK already propagates
    documentationUrl: https://timo-jakob.github.io/timos-claude-code-plugins/reference/api-styleguide/#correlation
    severity: error
    given:
      - "$.paths[*].parameters[*]"
      - "$.paths[*][*].parameters[*]"
      - "$.components.parameters[*]"
      - "$.paths[*][*].responses[*].headers"
      - "$.components.headers"
    then:
      - field: name
        function: pattern
        functionOptions:
          notMatch: "/^(x-(request|correlation|trace)|request)-id$/i"
      - field: "@key"
        function: pattern
        functionOptions:
          notMatch: "/^(x-(request|correlation|trace)|request)-id$/i"
