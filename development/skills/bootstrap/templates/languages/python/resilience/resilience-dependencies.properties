# The hard/soft declaration of this service's DIRECT dependencies (#1143, epic #964).
#
# This is the readiness hinge of the org resilience policy, and the whole dependency
# set a reviewer has to read. One line per dependency:
#
#     <name>=hard|soft
#
#   hard  nothing works without it. Its loss FAILS /health/ready, so Kubernetes sheds
#         traffic away from the pod, and /health reports the aggregate as "down".
#   soft  degraded operation is possible. Its loss NEVER fails readiness -- the
#         breaker opens, the pod stays ready, /health reports "degraded", and the
#         background reconnect restores full function with no deploy.
#
# That single classification is what resolves the tension between naive readiness
# (shed traffic on any dependency loss) and resilience (stay up and degrade).
#
# `<name>` is one string doing three jobs: the key /health reports the dependency
# under, the name of its circuit breaker, and the name a client passes to
# DependencyCatalog.call(...). They cannot drift apart because there is only one.
#
# DIRECT dependencies only -- the ones this service calls itself. Never list a
# downstream's downstream: each service reports one hop and the observability layer
# assembles the graph.
#
# THE SAME FILE NAME AND FORMAT AS THE JAVA PAYLOAD, on purpose. It is not a Python
# convention (there is no `.properties` in Python), and that is the point: hard-vs-soft
# is an operational judgement made by whoever is on call, and the one file they have to
# find is in the same place, with the same syntax, in every service this family
# bootstraps. It is parsed by dependency_catalog.parse_declaration, not by any library.
#
# THE TWO ENTRIES BELOW ARE WORKED EXAMPLES, NOT YOUR DEPENDENCIES. Shipped verbatim
# they FAIL STARTUP on DependencyCatalog.require_all_declared_guarded(), because no
# client in your service guards them -- which is the guard doing its job. Skip that
# call and the failure goes quiet instead: /health reports two dependencies this
# service does not have as "up", a conformant-shaped health surface that lies. Replace
# them with your real ones.
#
# Read at startup from $OPS_DEPENDENCIES_FILE when that is set (a mounted ConfigMap, so
# hard-vs-soft can be re-judged without a rebuild), else from this file BESIDE
# dependency_catalog.py (not the working directory -- a container's CWD is whatever the
# entrypoint set). A dependency guarded in code but missing here is a startup failure,
# by design: DependencyCatalog.require_declared refuses it rather than let a dependency
# stay invisible to /health.

orders-db=hard
pricing-api=soft
