# golangci-lint v2 config.
# Docs: https://golangci-lint.run/usage/configuration/
# Migration guide (v1 → v2): https://golangci-lint.run/docs/product/migration-guide/
#
# Key v2 changes from v1:
#   - linters.disable-all: true → linters.default: none
#   - gosimple + stylecheck merged into staticcheck; remove from enable
#   - typecheck is always on; remove from enable
#   - linters-settings → linters.settings (nested)
#   - issues.exclude-rules → linters.exclusions.rules (nested)
#   - run.timeout removed (no timeout by default in v2)

# Line-length policy: this org targets 120 columns for every linter/formatter
# that supports it (see ARCHITECTURE.md "Line-length policy"). Go is a documented
# EXEMPTION — gofmt does not wrap lines and Go convention avoids line-length
# linting, so the `lll` linter is intentionally NOT enabled here.

version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - gocritic
    - unconvert
    - misspell
    - bodyclose
    - nilerr

  settings:
    gosec:
      excludes:
        - G104   # unhandled errors — errcheck covers this with more nuance
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
