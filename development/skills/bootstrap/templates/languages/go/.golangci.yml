# golangci-lint v2 config.
# Docs: https://golangci-lint.run/usage/configuration/
# Migration guide (v1 → v2): https://golangci-lint.run/docs/product/migration-guide/
#
# Key v2 changes from v1:
#   - linters.disable-all: true → linters.default: none
#   - gosimple + stylecheck merged into staticcheck; remove from enable
#   - typecheck is always on; remove from enable
#   - linters-settings → linters.settings (nested)
#   - issues.exclude-rules → linters.exclusions.rules (nested)
#   - run.timeout removed (no timeout by default in v2)

# Line-length policy: this org targets 120 columns for every linter/formatter
# that supports it (see ARCHITECTURE.md "Line-length policy"). Go is a documented
# EXEMPTION — gofmt does not wrap lines and Go convention avoids line-length
# linting, so the `lll` linter is intentionally NOT enabled here.

version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - gocritic
    - unconvert
    - misspell
    - bodyclose
    - nilerr

  settings:
    gosec:
      excludes:
        - G104   # unhandled errors — errcheck covers this with more nuance
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-naming

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

# Formatters (v2 `formatters` section, driven by `golangci-lint fmt`). This is
# the single mechanical format layer the blessed stack promises: `fmt` applies
# gofumpt (a strict gofmt superset) and gci (deterministic import grouping), so
# `golangci-lint fmt` + `golangci-lint run --fix` is the whole format+autofix
# pass — no separate gofumpt/goimports invocation. Formatters are NOT controlled
# via the `linters` section or `-E`/`-D`; they live here.
formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      # standard → third-party → this module's own packages, each a blank-line
      # group. `localmodule` resolves the module path from go.mod, so no repo
      # name is hardcoded here.
      sections:
        - standard
        - default
        - localmodule
  exclusions:
    # Generated buf output is not hand-written; formatting it is meaningless and
    # would fight the codegen. `strict` follows the Go generated-file convention
    # (the `// Code generated … DO NOT EDIT.` header).
    generated: strict
