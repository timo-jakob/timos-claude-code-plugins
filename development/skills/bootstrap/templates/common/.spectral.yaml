# Spectral ruleset — the org API styleguide, consumed by EXACT PIN (issue #689).
#
# This file is a thin SHIM. It carries no rules of its own: the normative content
# lives in one place — styleguide/spectral/ruleset.yaml in the plugin repo —
# published as an immutable git tag and served over jsDelivr. Every bootstrapped
# repo extends the same pinned URL, so "the org styleguide" is one artifact rather
# than N drifting copies. The #692 starter this replaces is retired: no flag, no
# "when configured", no vendored fallback copy.
#
# THE PIN IS EXACT, ALWAYS. Never a floating tag, never @latest, never a branch
# ref. Your enforced rules change only when a Renovate PR bumps the version below
# and a human merges it — never spontaneously, on someone else's release.
#
# TAGS ARE IMMUTABLE. A styleguide-v* tag, once cut, is never moved or deleted; a
# mistake is superseded by the next version. jsDelivr caches by tag, so re-pointing
# one would hand different repos different rules under the same version string,
# with no PR anywhere to notice.
#
# A CDN OUTAGE FAILS THIS LINT LOUDLY, by design. There is deliberately no offline
# fallback: a lint that degraded to "no rules loaded, 0 problems" would report
# success while enforcing nothing, which is strictly worse than a red build.
#
# The CI wiring (.github/workflows/contracts-lint.yml) references this file BY
# PATH, so the pin can move without touching the pipeline.
extends:
  - https://cdn.jsdelivr.net/gh/timo-jakob/timos-claude-code-plugins@styleguide-v1.0.0/styleguide/spectral/ruleset.yaml
