# Spectral ruleset — API styleguide (STARTER, issue #692).
#
# This is a minimal starter ruleset. Its CONTENT is meant to be replaced: the
# org API styleguide epic (#689) swaps in the shared org ruleset. The CI wiring
# (.github/workflows/contracts-lint.yml) references this file BY PATH, so
# replacing the ruleset never touches the pipeline — swap content freely.
extends: ["spectral:oas"]
rules:
  # Every operation needs a stable operationId — the consumer's client
  # generator and the deprecation -> @deprecated mapping (#707) key off it.
  operation-operationId: error
  operation-operationId-unique: error
  # Descriptions ARE the governance-portal docs (the APIM channel, #706), so
  # a missing one is worth a warning, not a hard failure, in the starter.
  info-description: warn
  operation-description: warn
  # Tags give the portal and the generated client a stable grouping.
  operation-tags: warn
  # Deprecation is a producer signal with a deadline (#695): anything the spec
  # marks `deprecated: true` should also declare `x-sunset: <date>` (RFC 8594),
  # so a dying operation always announces WHEN it dies. The recursive null-safe
  # filter mirrors spectral:oas's own `duplicated-entry-in-enum` given; because
  # it also matches deprecated parameters/schemas (and any `deprecated: true`
  # inside example data), it is a WARN in the starter — the org styleguide (#689)
  # can scope it to operations and raise it to error.
  deprecation-has-sunset:
    description: A deprecated element should declare an x-sunset date (RFC 8594).
    message: "deprecated but missing x-sunset: <date> (RFC 8594)"
    severity: warn
    given: "$..[?(@ && @.deprecated === true)]"
    then:
      field: x-sunset
      function: truthy
