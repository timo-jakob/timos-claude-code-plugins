name: script-tests

# Behavioral tests (bats) for the repo's shell scripts — the A2 layer of #263.
# Runs natively on the disposable runner (the Docker image in tests/Dockerfile is
# only for local isolation). Triggered when the scripts under test, the tests, or
# this workflow change.
#
# Runs on BOTH ubuntu (bash 5) and macOS (Apple's stock /bin/bash 3.2). macOS is
# the primary platform for bootstrap/maintenance, and a whole class of bash-4-isms
# (e.g. `mapfile`, which broke detect-stack.sh in #292) pass on bash 5 but abort
# on 3.2. The macOS lane closes that gap. See #293.

on:
  pull_request:
    paths:
      - 'tests/**'
      # any plugin skill's scripts — GitHub path filters are not implicitly
      # **-prefixed, so a per-skill line is needed for the suite to gate the
      # script it covers (e.g. resolve-issue's resolve-story-loop.zsh, #974).
      - 'development/skills/**/scripts/**'
      # plugin-level shared scripts (development/scripts/<area>/, e.g. the
      # telemetry emitter + validator, #740) — 'scripts/**' below matches only a
      # top-level scripts/ dir, so this line is what gates them
      - 'development/scripts/**'
      # plugin-level hook scripts (development/hooks/, e.g. the fable->opus
      # PreToolUse hook, #1017) — same non-**-prefixed hazard as the lines above
      - 'development/hooks/**'
      - 'scripts/**'
      - 'development-claude-plugin/**'
      # prose the suite asserts on: the review-loop budget guard (#993) checks
      # SKILL.md / agent instructions / ARCHITECTURE.md / docs/explanation
      # against the executable constant, so a docs-only PR that reverts one of
      # those restatements must trigger the suite at PR time — not turn up as a
      # red main on the unfiltered push run
      - 'development/skills/**/SKILL.md'
      # per-skill docs the suite asserts on: tests/telemetry-user-docs.bats
      # (#1009) pins the refine-issue walkthrough's telemetry cross-links, and
      # 'development/skills/**/scripts/**' above does not match a docs/ path
      - 'development/skills/**/docs/**'
      - 'development/agents/**'
      - 'ARCHITECTURE.md'
      - 'docs/explanation/**'
      # the hand-written plugin overview + the Go plugin's own inventory:
      # tests/go-docs-parity.bats asserts one against the other (#1129), and
      # BOTH sides of that check are edited by PRs this filter otherwise misses
      # — a docs-only edit to plugins.md, and a PR adding/renaming a Go agent
      # or skill (which is literally how #868 reached 18 agents against a
      # 12-agent doc). Same non-**-prefixed hazard as the lines above:
      # 'development/**' does NOT match 'development-go/**'.
      - 'docs/reference/plugins.md'
      - 'development-go/**'
      # the third side of the same check: go-docs-parity.bats asserts the Go
      # approver-policy overlay does NOT exist yet, so the PR that finally lands
      # it must red this suite at PR time rather than after merge
      - 'development/skills/bootstrap/templates/**'
      # same rule, extended for the Grafana hand-off suite (#1008): it asserts
      # the reference page's envelope table against the validator's own key
      # list, its flag table against each script's --help, and that both new
      # pages are registered — so docs/reference, the MOC and the nav are all
      # prose this suite gates
      - 'docs/reference/**'
      # tests/telemetry-rollup.bats asserts docs/how-to/read-pipeline-telemetry.md
      # exists and is registered in the how-to index (#1007) — same rule
      - 'docs/how-to/**'
      - 'docs/index.md'
      - 'mkdocs.yml'
      - '.github/workflows/script-tests.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: build-golden-798-target.zsh extracts its fixture from
          # a historical commit (4202beb), which a shallow checkout lacks (#808).
          fetch-depth: 0
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # nodejs: the #707 contract-consumer transformer test executes a pure-JS
          # .mjs with node — a declared test dependency, not incidental.
          # parallel: GNU parallel is bats' `--jobs` backend, which run-gate.zsh
          # uses to parallelise the suite (#980).
          sudo apt-get install -y --no-install-recommends bats jq shellcheck zsh python3 nodejs parallel
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq shellcheck node parallel
      - name: Run shell-script behavioral tests
        run: |
          # On macOS, force the bash scripts onto Apple's stock /bin/bash 3.2 —
          # the version users actually have — by putting /bin first on PATH, so
          # the tests' `bash <script>` calls resolve to 3.2. Homebrew's bash 5 and
          # the brew-installed tools (jq, bats) stay available later in PATH, and
          # `zsh` resolves to the system /bin/zsh.
          if [ "$RUNNER_OS" = "macOS" ]; then export PATH="/bin:$PATH"; fi
          echo "bash for scripts under test: $(bash --version | head -1)"
          # Silence GNU parallel's citation notice so it never leaks into the TAP
          # stream (#980).
          mkdir -p ~/.parallel && touch ~/.parallel/will-cite
          # Run the suite through the blessed gate helper: it parallelises via
          # `bats --jobs $(nproc)`, runs the suite ONCE, and exits with bats' real
          # code — the same single-run parallel path skills use, dogfooded here.
          zsh development/skills/resolve-issue/scripts/run-gate.zsh --tests-dir tests
