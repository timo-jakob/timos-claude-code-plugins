name: script-tests

# Behavioral tests (bats) for the repo's shell scripts — the A2 layer of #263.
# Runs natively on the disposable runner (the Docker image in tests/Dockerfile is
# only for local isolation). Triggered when the scripts under test, the tests, or
# this workflow change.

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'development/skills/maintenance/scripts/**'
      - 'development/skills/bootstrap/scripts/**'
      - 'scripts/**'
      - 'development-claude-plugin/**'
      - '.github/workflows/script-tests.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq shellcheck zsh python3
      - name: Run shell-script behavioral tests
        run: bats tests
