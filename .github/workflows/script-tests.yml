name: script-tests

# Behavioral tests (bats) for the repo's shell scripts — the A2 layer of #263.
# Runs natively on the disposable runner (the Docker image in tests/Dockerfile is
# only for local isolation). Triggered when the scripts under test, the tests, or
# this workflow change.
#
# Runs on BOTH ubuntu (bash 5) and macOS (Apple's stock /bin/bash 3.2). macOS is
# the primary platform for bootstrap/maintenance, and a whole class of bash-4-isms
# (e.g. `mapfile`, which broke detect-stack.sh in #292) pass on bash 5 but abort
# on 3.2. The macOS lane closes that gap. See #293.

on:
  pull_request:
    paths:
      - 'tests/**'
      # any plugin skill's scripts — GitHub path filters are not implicitly
      # **-prefixed, so a per-skill line is needed for the suite to gate the
      # script it covers (e.g. resolve-issue's resolve-story-loop.zsh, #974).
      - 'development/skills/**/scripts/**'
      # plugin-level shared scripts (development/scripts/<area>/, e.g. the
      # telemetry emitter + validator, #740) — 'scripts/**' below matches only a
      # top-level scripts/ dir, so this line is what gates them
      - 'development/scripts/**'
      # plugin-level hook scripts (development/hooks/, e.g. the fable->opus
      # PreToolUse hook, #1017) — same non-**-prefixed hazard as the lines above
      - 'development/hooks/**'
      - 'scripts/**'
      - 'development-claude-plugin/**'
      # prose the suite asserts on: the review-loop budget guard (#993) checks
      # SKILL.md / agent instructions / ARCHITECTURE.md / docs/explanation
      # against the executable constant, so a docs-only PR that reverts one of
      # those restatements must trigger the suite at PR time — not turn up as a
      # red main on the unfiltered push run
      - 'development/skills/**/SKILL.md'
      # per-skill docs the suite asserts on: tests/telemetry-user-docs.bats
      # (#1009) pins the refine-issue walkthrough's telemetry cross-links, and
      # 'development/skills/**/scripts/**' above does not match a docs/ path
      - 'development/skills/**/docs/**'
      - 'development/agents/**'
      - 'ARCHITECTURE.md'
      - 'docs/explanation/**'
      # the hand-written plugin overview + the Go plugin's own inventory:
      # tests/go-docs-parity.bats asserts one against the other (#1129), and
      # BOTH sides of that check are edited by PRs this filter otherwise misses
      # — a docs-only edit to plugins.md, and a PR adding/renaming a Go agent
      # or skill (which is literally how #868 reached 18 agents against a
      # 12-agent doc). Same non-**-prefixed hazard as the lines above:
      # 'development/**' does NOT match 'development-go/**'.
      - 'docs/reference/plugins.md'
      - 'development-go/**'
      # the other three SERVICE-language plugins, for the same reason:
      # tests/resilience-review-dimension.bats (#966) asserts each panel's
      # agent table, launch counts and reviewer definitions against
      # development-{java,python,swift}/, and — same non-**-prefixed hazard —
      # none of the 'development/**' lines above match those paths. Without
      # these, a PR renumbering Swift's panel or dropping the Java resilience
      # row would match no filter and only red the unfiltered push-to-main run.
      - 'development-java/**'
      - 'development-python/**'
      - 'development-swift/**'
      # the marketplace manifest: resilience-review-dimension.bats asserts the
      # development-go entry's description byte-equal to its plugin.json, and a
      # marketplace-only edit matches none of the per-plugin globs above
      - '.claude-plugin/marketplace.json'
      # the third side of the same check: go-docs-parity.bats asserts the Go
      # approver-policy overlay does NOT exist yet, so the PR that finally lands
      # it must red this suite at PR time rather than after merge — AND, since
      # #1154, bootstrap-iac-pipeline.bats reads the kubernetes-ci workflow
      # template here. Two suites now depend on this entry: retiring the Go
      # assertion does not free it.
      - 'development/skills/bootstrap/templates/**'
      # same rule, extended for the Grafana hand-off suite (#1008): it asserts
      # the reference page's envelope table against the validator's own key
      # list, its flag table against each script's --help, and that both new
      # pages are registered — so docs/reference, the MOC and the nav are all
      # prose this suite gates
      - 'docs/reference/**'
      # ...and finally, the catch-all — which is what actually makes this filter
      # CORRECT, and why no line above may be read as the boundary of what this
      # suite gates (#1060). tests/messaging-position.bats sweeps EVERY tracked
      # file for a reintroduced superseded broker name, so the suite's assertion
      # surface is now the whole repository. An enumerated filter cannot be a
      # superset of "every tracked file": the first attempt at this missed
      # docs/adding-a-language-plugin.md, development/.claude-plugin/plugin.json,
      # the other eight workflows and every repo-root config file — and any tree
      # added later would silently join them. A per-path list cannot be kept
      # complete by review, so it is not asked to be.
      #
      # The lines above are therefore KEPT AS DOCUMENTATION, not as the trigger:
      # each records why one tree specifically matters to one suite, which is
      # knowledge '**' does not carry. The cost of the catch-all is that this
      # suite now runs on every PR; that is the deliberate trade for never again
      # discovering an ungated tree as a red main after a bot-armed auto-merge.
      - '**'
      # tests/telemetry-rollup.bats asserts docs/how-to/read-pipeline-telemetry.md
      # exists and is registered in the how-to index (#1007) — same rule
      - 'docs/how-to/**'
      # tests/dogfood-c4.bats asserts this repo's own C4 pages against the
      # c4/v1 parser and against marketplace.json (#795, #1151) — a PR touching
      # only a diagram matched nothing here, so it ran no bats leg at all
      - 'docs/architecture/**'
      # tests/kubernetes-plugin-skeleton.bats derives the plan's reproduced
      # ARCHITECTURE block against the shipped section (#1151), so a PR editing
      # only that plan must trigger the suite at PR time — not turn up as a red
      # main on the unfiltered push run
      - 'docs/superpowers/**'
      # tests/kubernetes-plugin-skeleton.bats asserts the plugin manifest's
      # load-bearing description clauses and README's plugin table (#1151);
      # note 'development/**' above does NOT match 'development-kubernetes/**'
      - 'development-kubernetes/**'
      - 'README.md'
      - 'docs/index.md'
      - 'mkdocs.yml'
      - '.github/workflows/script-tests.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: build-golden-798-target.zsh extracts its fixture from
          # a historical commit (4202beb), which a shallow checkout lacks (#808).
          fetch-depth: 0
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # nodejs: the #707 contract-consumer transformer test executes a pure-JS
          # .mjs with node — a declared test dependency, not incidental.
          # parallel: GNU parallel is bats' `--jobs` backend, which run-gate.zsh
          # uses to parallelise the suite (#980).
          # yamllint: tests/bootstrap-iac-pipeline.bats (#1154) lints the
          # kubernetes-ci workflow template with the repo's own strict config.
          # Called unguarded on purpose — a skip would silently drop the only
          # structural coverage that template has — so it is a declared dependency.
          sudo apt-get install -y --no-install-recommends \
            bats jq shellcheck zsh python3 nodejs parallel yamllint
          # yq deliberately NOT from apt: Debian/Ubuntu's `yq` package is
          # kislyuk's python-yq, a different query language from mikefarah's Go
          # yq that the suite (and the shipped kubernetes-ci template) are
          # written against. Under python-yq, `-o=json` is rejected and PyYAML's
          # YAML 1.1 parse resolves a workflow's `on:` key to the boolean true —
          # so the same assertions would mean different things on the two legs.
          # Pin the real one instead of relying on the runner image's PATH order.
          sudo curl -sSfLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
        env:
          YQ_VERSION: 4.44.3
      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        # brew's `yq` IS mikefarah's, so the macOS leg needs no special case
        run: brew install bats-core jq shellcheck node parallel yamllint yq
      - name: Run shell-script behavioral tests
        run: |
          # On macOS, force the bash scripts onto Apple's stock /bin/bash 3.2 —
          # the version users actually have — by putting /bin first on PATH, so
          # the tests' `bash <script>` calls resolve to 3.2. Homebrew's bash 5 and
          # the brew-installed tools (jq, bats) stay available later in PATH, and
          # `zsh` resolves to the system /bin/zsh.
          if [ "$RUNNER_OS" = "macOS" ]; then export PATH="/bin:$PATH"; fi
          echo "bash for scripts under test: $(bash --version | head -1)"
          # Silence GNU parallel's citation notice so it never leaks into the TAP
          # stream (#980).
          mkdir -p ~/.parallel && touch ~/.parallel/will-cite
          # Run the suite through the blessed gate helper: it parallelises via
          # `bats --jobs $(nproc)`, runs the suite ONCE, and exits with bats' real
          # code — the same single-run parallel path skills use, dogfooded here.
          zsh development/skills/resolve-issue/scripts/run-gate.zsh --tests-dir tests
