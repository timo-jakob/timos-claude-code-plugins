# Pre-commit hooks for timos-claude-code-plugins — a Claude-plugin repo whose
# scripts ARE code (shell) and whose docs are markdown, so we lint both.
#
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
#
# CI mirror: .github/workflows/lint.yml runs `pre-commit run --all-files`
# (skipping gitleaks, which has its own workflow) and is a required check.
#
# shellcheck runs on .sh and .bash; shfmt on .sh only (a .bash bats helper
# library is indented like the .bats files that source it — see the shfmt hook's
# note below). .zsh scripts are syntax-checked with `zsh -n` (shellcheck can't
# parse zsh). Extension matches the shebang for every script, so no per-file
# exceptions are needed — the one shebang-less file, tests/assertions.bash
# (bats sources it), carries a `# shellcheck shell=bash` directive instead.

repos:
  # --- universal hooks -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses MkDocs' custom YAML tags (e.g.
        # `!!python/name:pymdownx.superfences.fence_code_format` for Mermaid),
        # which check-yaml's safe loader can't construct. yamllint (below)
        # still lints it for style; excluding it here only skips tag
        # construction, not validation.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      # Private-key detection is handled by gitleaks (below + its own CI
      # workflow) with a tuned .gitleaks.toml allowlist; a second detector
      # here would only duplicate that allowlist and false-positive on docs
      # that show PEM headers.

  # --- YAML lint (repo .yamllint: line-length 120, GH Actions `on:` allowed) --
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # --strict: warnings fail the hook — the zero-warnings policy (#781).
        # The types/files override extends the hook to the bootstrap
        # *.ya?ml.tmpl templates: .yamllint's yaml-files already declares them
        # lintable, but pre-commit's default `types: [yaml]` filter never
        # forwarded them, so template regressions were invisible to the hook.
        args: [--strict]
        types: [file]
        files: (\.ya?ml(\.tmpl)?|\.yamllint)$

  # --- secret scanning (shift-left; CI runs gitleaks in its own workflow) -----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- shell: shellcheck + shfmt on bash; zsh -n on zsh -----------------------
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        # Bash only (.sh, .bash): .zsh is checked with `zsh -n` below
        # (shellcheck SC1071s on it) and .bats is exercised by the test suite.
        files: \.(sh|bash)$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: ["-d"]
        # Bash only (see shellcheck note): skip .zsh, .bats — and .bash,
        # which is a bats helper library indented like the .bats files that
        # source it (2 spaces), not in shfmt's tab style.
        files: \.sh$
  - repo: local
    hooks:
      - id: zsh-syntax
        name: zsh -n syntax check (.zsh)
        entry: bash -c 'for f in "$@"; do zsh -n "$f" || exit 1; done' --
        language: system
        files: \.zsh$

  # --- markdown lint ---------------------------------------------------------
  # See .markdownlint.jsonc — all rules enforced except two documented
  # exceptions: MD013 is tuned to a 120-char line length (code blocks + tables
  # exempt, matching yamllint), and MD041 (first-line heading) is off because
  # plugin docs are frontmatter-led, not H1-led. Rationale is inline in the
  # config.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        # tests/fixtures/**/*.md are byte-exact GOLDENS of generated output
        # (escalation comments, progress.md blocks) — the whole point is that
        # they match a script's bytes exactly, so reformatting them to satisfy
        # a prose linter would destroy what they pin (#995).
        exclude: ^tests/fixtures/.*\.md$
